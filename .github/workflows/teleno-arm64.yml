name: Teleno Linux ARM64 qualification
on:
  push:
    branches: [codex/teleno-linux-arm64]
    paths: ['community/teleno/**', '.github/workflows/teleno-arm64.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teleno-arm64-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 360
    env:
      JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      HUNTER_JOBS_NUMBER: '2'
      KOINOS_BUILD_TESTS: 'ON'
      CFLAGS: '-march=armv8-a -mtune=generic'
      CXXFLAGS: '-march=armv8-a -mtune=generic'
    steps:
      - name: Install Debian 12 build tools (Pi OS Bookworm compatibility)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends autoconf automake build-essential ca-certificates cmake curl file git libssl-dev libtool make ninja-build perl pkg-config python3 tar xz-utils zlib1g-dev
          test "$(uname -m)" = aarch64
      - uses: actions/checkout@v4
      - name: Check out the exact existing Teleno engine source
        uses: actions/checkout@v4
        with:
          repository: koinos/teleno
          ref: 2c11229267cff2f9ee39ed8e56ab70af391d85ce
          path: teleno-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: teleno-source/.deps
          key: teleno-arm64-bookworm-v2-2c11229267cf
      - name: Prepare the GCC 12 dependency compatibility patch
        run: |
          cat teleno-source/cmake/cpp-libp2p-koinos.patch community/teleno/scripts/patches/libp2p-gcc12-templates.patch > "$RUNNER_TEMP/teleno-libp2p-gcc12.patch"
          sha256sum community/teleno/scripts/patches/libp2p-gcc12-templates.patch
      - name: Build the native ARM64 engine
        working-directory: teleno-source
        env:
          CPP_LIBP2P_PATCH: ${{ runner.temp }}/teleno-libp2p-gcc12.patch
        run: ./scripts/build-cpp-libp2p-koinos.sh
      - name: Build and run upstream native tests
        working-directory: teleno-source
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/teleno-tests/tmp
          TELENO_TEST_ARTIFACT_ROOT: ${{ runner.temp }}/teleno-tests/artifacts
          TELENO_TEST_BUILD_ROOT: ${{ github.workspace }}/teleno-source/build
        run: |
          mkdir -p "$TMPDIR" "$TELENO_TEST_ARTIFACT_ROOT"
          # GCC 12 rejects default construction of Fizzy's aggregate import
          # union in this test fixture. Explicit value initialization preserves
          # the same fixture and every assertion. Restore the test source and
          # rebuild the engine cleanly before running the complete suite.
          git apply ../community/teleno/scripts/patches/teleno-gcc12-test-fixture.patch
          trap 'git restore -- tests/vm/module_capacity_test.cpp' EXIT
          cmake --build build --parallel 2
          git restore -- tests/vm/module_capacity_test.cpp
          trap - EXIT
          cmake --build build --target teleno_node --parallel 2
          test -z "$(git status --porcelain)"
          ctest --test-dir build --output-on-failure --output-junit build/native-tests.xml
          python3 -B -m unittest -v tests/scripts/benchmark_transaction_tps_test.py
      - name: Record the exact ARM64 runtime and package it
        working-directory: teleno-source
        run: |
          test -z "$(git status --porcelain)"
          ./build/teleno_node --version | tee build/native-version.txt
          ./build/teleno_node --help > build/native-help.txt
          file build/teleno_node
          ldd build/teleno_node
          python3 -B scripts/record-native-build.py --binary build/teleno_node --output build/generated/teleno-node-build-info.json
          mkdir -p ../arm64-runtime/teleno-node-1.3.0/bin
          cp build/teleno_node ../arm64-runtime/teleno-node-1.3.0/bin/
          cp LICENSE ../arm64-runtime/teleno-node-1.3.0/
          cp ../community/teleno/scripts/patches/libp2p-gcc12-templates.patch ../arm64-runtime/teleno-node-1.3.0/
          cp ../community/teleno/scripts/patches/teleno-gcc12-test-fixture.patch ../arm64-runtime/teleno-node-1.3.0/
          python3 - <<'PY'
          import hashlib, json, pathlib
          patch = pathlib.Path('../community/teleno/scripts/patches/libp2p-gcc12-templates.patch')
          test_patch = pathlib.Path('../community/teleno/scripts/patches/teleno-gcc12-test-fixture.patch')
          result = {'engineSource': '2c11229267cff2f9ee39ed8e56ab70af391d85ce', 'cppLibp2pSource': 'c03bf7c44c4fd30a390f3ef93bd1eab482e686a6', 'patch': patch.name, 'patchSha256': hashlib.sha256(patch.read_bytes()).hexdigest(), 'purpose': 'C++ template disambiguation for GCC 12; dependency header syntax only'}
          result.update({'testFixturePatch': test_patch.name, 'testFixturePatchSha256': hashlib.sha256(test_patch.read_bytes()).hexdigest(), 'testFixturePurpose': 'Explicit aggregate initialization in one upstream test; no assertion or runtime change; test source restored before final clean engine build'})
          pathlib.Path('build/arm64-compatibility.json').write_text(json.dumps(result, indent=2)+'\n')
          PY
          cp build/arm64-compatibility.json ../arm64-runtime/teleno-node-1.3.0/
          tar --sort=name --mtime='UTC 2026-10-23' --owner=0 --group=0 --numeric-owner -czf ../arm64-runtime/teleno-node-1.3.0-linux-arm64.tar.gz -C ../arm64-runtime teleno-node-1.3.0
          sha256sum build/teleno_node ../arm64-runtime/*.tar.gz | tee build/arm64-checksums.txt
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teleno-linux-arm64-1.3.0-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            arm64-runtime/*.tar.gz
            teleno-source/build/native-version.txt
            teleno-source/build/native-help.txt
            teleno-source/build/native-tests.xml
            teleno-source/build/generated/teleno-node-build-info.json
            teleno-source/build/arm64-checksums.txt
            teleno-source/build/arm64-compatibility.json
      - name: Preserve dependency builds after success or failure
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: teleno-source/.deps
          key: teleno-arm64-bookworm-v2-2c11229267cf
